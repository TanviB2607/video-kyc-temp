<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video KYC Upload</title>
</head>
<body>
    <h2>Upload ID Document and Video</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="id_doc">ID Document (Aadhaar/PAN):</label>
        <input type="file" name="id_doc" required><br><br>
        <label for="video">Video (holding ID):</label>
        <input type="file" name="video" required><br><br>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
